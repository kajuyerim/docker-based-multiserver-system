openapi: 3.0.3
info:
  title: Docker Multiserver API
  version: 1.0.0
  description: >-
    HTTP API served by the Go backend replicas behind NGINX. Every backend
    route accepts Bearer authentication only when AUTH_TOKEN is configured;
    otherwise authentication is disabled. NGINX applies a per-client-IP rate
    limit only to the exact root path, including requests with query strings.
servers:
  - url: /
    description: Current origin, routed through NGINX
security:
  - bearerAuth: []
  - {}
tags:
  - name: API
    description: JSON application endpoints
  - name: Monitoring
    description: Prometheus metrics endpoint
paths:
  /:
    get:
      tags: [API]
      operationId: getRootCounters
      summary: Increment and return request counters
      description: >-
        Increments the local counter and the shared Redis global_count using
        atomic INCR. NGINX rate limits this path at 10 requests per second per
        client IP, with a burst of 20 requests served immediately. Query
        strings do not change which limiter applies. Only GET increments
        counters; other methods return 405 before touching counters.
      responses:
        '200':
          description: Both counters were incremented.
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Method is not GET; counters were not changed.
          headers:
            Allow:
              description: The only supported method for this path.
              schema:
                type: string
                enum: [GET]
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '429':
          description: NGINX rate limit exceeded; request did not reach a backend.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                example: 1
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate limit exceeded
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags: [API]
      operationId: getHealth
      summary: Check backend process liveness
      description: This check does not test Redis availability and does not change counters.
      responses:
        '200':
          description: Backend process is live.
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /store:
    get:
      tags: [API]
      operationId: storeValue
      summary: Store a value in the Redis primary
      description: Writes the supplied value without an expiration time. Does not change request counters.
      parameters:
        - name: key
          in: query
          required: true
          description: Non-empty Redis key.
          schema:
            type: string
            minLength: 1
        - name: value
          in: query
          required: true
          description: Non-empty value to store.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Value was stored.
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /get:
    get:
      tags: [API]
      operationId: getValue
      summary: Read a value from the Redis replica
      description: >-
        Reads from REDIS_READ_ADDR (the primary when unset) with a two-second deadline and
        does not fall back to the primary. Replication is asynchronous, so a
        recently stored value may not be visible immediately. Does not change
        request counters.
      parameters:
        - name: key
          in: query
          required: true
          description: Non-empty Redis key.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Value was read, or the key was absent (value is null).
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponse'
              examples:
                found:
                  summary: Existing key
                  value:
                    server_id: app1
                    key: greeting
                    value: hello
                absent:
                  summary: Missing key
                  value:
                    server_id: app1
                    key: missing
                    value: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /slow:
    get:
      tags: [API]
      operationId: runSlowRequest
      summary: Wait for a bounded number of seconds
      description: >-
        Accepts any integer; values below zero are clamped to 0 and values above
        10 are clamped to 10. The response reports the number of seconds actually
        slept. Does not change request counters.
      parameters:
        - name: seconds
          in: query
          required: true
          description: Requested duration in seconds; clamped to the inclusive range 0 through 10.
          schema:
            type: integer
      responses:
        '200':
          description: Wait completed.
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /metrics:
    get:
      tags: [Monitoring]
      operationId: getMetrics
      summary: Expose Prometheus metrics
      description: >-
        Returns metrics for the selected backend replica. Reading metrics does
        not increment the application request counters. This endpoint is subject
        to the same optional Bearer authentication configuration as other backend
        routes; Prometheus scrapes it internally.
      responses:
        '200':
          description: Prometheus text exposition.
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP multiserver_local_count Root requests counted by this backend process.
                # TYPE multiserver_local_count gauge
                multiserver_local_count{server_id="app1"} 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events:
    get:
      tags: [API]
      operationId: subscribeCounterEvents
      summary: Subscribe to root counter updates over WebSocket
      description: >-
        This HTTP operation documents the WebSocket handshake; OpenAPI does not
        model the messages sent after upgrade. Successful upgrades send JSON
        text frames with this shape: `{"global_count": 42}`. Each successful
        application GET / publishes its new count on the primary Redis
        `counter_updates` channel, so subscribers on every backend replica can
        receive it. Delivery is best effort with no replay: direct Redis writes
        are not watched, concurrent notifications may arrive out of order, and
        Redis outages may lose notifications while persisted counter values
        remain. Ping frames are sent every 20 seconds; writes have a five-second
        timeout, and backend shutdown disconnects clients. Browser WebSocket
        clients can use same-origin connections only when auth is disabled,
        because browser APIs cannot set a custom Authorization header.
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          headers:
            Upgrade:
              description: Accepted protocol upgrade.
              schema:
                type: string
                example: websocket
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: WebSocket origin validation rejected the request; protocol rejection body is not guaranteed to be JSON.
        '426':
          description: The request did not include a valid WebSocket upgrade; protocol rejection body is not guaranteed to be JSON.
          headers:
            Upgrade:
              description: Required upgrade protocol.
              schema:
                type: string
                example: websocket
        '503':
          description: Redis subscription could not be established; this failure uses the JSON API error format.
          headers:
            X-Server-Id:
              $ref: '#/components/headers/ServerId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: event stream unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required when the backend is configured with a non-empty AUTH_TOKEN.
  headers:
    ServerId:
      description: Backend replica that handled the request.
      schema:
        type: string
        example: app1
    RequestId:
      description: Correlation ID generated by NGINX; direct backend calls preserve a supplied ID.
      schema:
        type: string
  responses:
    BadRequest:
      description: A required query parameter is missing, empty, or invalid.
      headers:
        X-Server-Id:
          $ref: '#/components/headers/ServerId'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Bearer token is missing or invalid when authentication is enabled.
      headers:
        X-Server-Id:
          $ref: '#/components/headers/ServerId'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
    InternalError:
      description: A Redis operation failed or timed out.
      headers:
        X-Server-Id:
          $ref: '#/components/headers/ServerId'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, server_id]
      properties:
        status:
          type: string
          enum: [ok]
        server_id:
          type: string
    RootResponse:
      type: object
      required: [server_id, local_count, global_count]
      properties:
        server_id:
          type: string
        local_count:
          type: integer
          format: int64
        global_count:
          type: integer
          format: int64
    StoreResponse:
      type: object
      required: [stored, key, value, server_id]
      properties:
        stored:
          type: boolean
          enum: [true]
        key:
          type: string
        value:
          type: string
        server_id:
          type: string
    GetResponse:
      type: object
      required: [server_id, key, value]
      properties:
        server_id:
          type: string
        key:
          type: string
        value:
          type: string
          nullable: true
    SlowResponse:
      type: object
      required: [server_id, slept]
      properties:
        server_id:
          type: string
        slept:
          type: integer
          minimum: 0
          maximum: 10
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
