name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight runs for the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes:
    name: Kubernetes deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install kind and Helm
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSLo helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          tar -xzf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Validate chart and manifests
        run: ./scripts/check-k8s.sh
      - name: Deploy and smoke test through ingress
        run: ./scripts/deploy-kind.sh
      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kind export kubeconfig --name multiserver
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name multiserver

  ci:
    name: vet + tests + stack acceptance + load
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: go vet
        working-directory: ./app
        run: go vet ./...

      - name: Set up Node for API lint
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.72.1 lint api/openapi.yaml

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: app

      - name: Install Go security scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: gosec HIGH severity gate
        working-directory: ./app
        run: gosec -severity high ./...

      - name: Reachable Go vulnerabilities
        working-directory: ./app
        run: govulncheck ./...

      - name: go test -race
        working-directory: ./app
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go-coverage
          path: app/coverage.out
          if-no-files-found: error

      - name: Generate local TLS certificate
        run: ./scripts/gen-cert.sh

      - name: docker compose build
        run: docker compose build

      - name: Trivy HIGH and CRITICAL image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          image-ref: multiserver-app:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 90

      - name: HTTPS smoke test
        run: ./scripts/test.sh

      - name: Served API documentation
        run: |
          curl --fail --silent --show-error --insecure https://localhost:8443/docs/openapi.yaml | cmp api/openapi.yaml -
          curl --fail --silent --show-error --insecure --location https://localhost:8443/docs | grep -q 'SwaggerUIBundle'
          curl --fail --silent --show-error --insecure https://localhost:8443/docs/swagger-ui-bundle.js --output /dev/null
          curl --fail --silent --show-error --insecure https://localhost:8443/docs/swagger-ui.css --output /dev/null

      - name: Metrics and dashboard integration
        run: python3 ./scripts/test-metrics.py

      - name: Distributed tracing integration
        run: python3 ./scripts/test-tracing.py

      - name: Redis replication and persistence tests
        run: ./scripts/test-redis.sh

      - name: Rate limiting without authentication
        run: ./scripts/test-security.sh

      - name: Authentication and authenticated smoke tests
        env:
          AUTH_TOKEN: ci-only-integration-token
        run: |
          docker compose up -d --wait --wait-timeout 90
          ./scripts/test-security.sh
          ./scripts/test.sh
          python3 ./scripts/test-metrics.py
          python3 ./scripts/test-tracing.py

      - name: Go benchmarks and full HTTPS load
        env:
          AUTH_TOKEN: ci-only-integration-token
          LOAD_RESULTS_DIR: ${{ runner.temp }}/performance
        run: ./scripts/run-load.sh

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: performance-results
          path: ${{ runner.temp }}/performance
          if-no-files-found: ignore

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down
