# TLS-terminating reverse proxy in front of three Go backend replicas.
# Round-robin load-balancing, fast failover on backend errors, and
# end-to-end X-Request-Id tracing. Mounted into nginx:alpine at
# /etc/nginx/conf.d/default.conf, which is `include`d inside the default
# nginx.conf's http {} block.

map $uri $rate_limit_key {
    default "";
    / $binary_remote_addr;
}
limit_req_zone $rate_limit_key zone=root_requests:10m rate=10r/s;

upstream backend {
    # Default LB strategy is round-robin.
    server app1:8080 max_fails=1 fail_timeout=10s;
    server app2:8080 max_fails=1 fail_timeout=10s;
    server app3:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 10m;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"error":"rate limit exceeded"}';
    }

    location / {
        limit_req zone=root_requests burst=20 nodelay;
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx generates a per-request id and forwards it. The backend
        # reads it, logs it, and stamps it on the response. We deliberately
        # do NOT `add_header X-Request-Id` on this side — that would
        # duplicate the value the backend already returns.
        proxy_set_header X-Request-Id $request_id;

        # CRITICAL: never `proxy_set_header` or `add_header` X-Server-Id —
        # the backend owns that header so the client sees which replica
        # actually handled the request. nginx must forward it unchanged.

        # Fail-fast timeouts so a dead backend surfaces within ~2 seconds.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    15s;   # /slow can sleep up to 10s — leave headroom

        # Transparent retry on a different upstream when one errors. Three
        # tries ≈ at most one attempt per replica before giving up.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 0;
    }
}
