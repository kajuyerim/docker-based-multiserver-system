# TLS-terminating reverse proxy in front of three Go backend replicas.
# Round-robin load-balancing, fast failover on backend errors, and
# end-to-end X-Request-Id tracing. Mounted into nginx:alpine at
# /etc/nginx/conf.d/default.conf, which is `include`d inside the default
# nginx.conf's http {} block.

map $uri $rate_limit_key {
    default "";
    / $binary_remote_addr;
}
limit_req_zone $rate_limit_key zone=root_requests:10m rate=10r/s;

map $uri $trace_enabled {
    default on;
    /health off;
    /metrics off;
}
otel_exporter {
    endpoint 127.0.0.1:4317;
    interval 1s;
}
otel_service_name nginx;
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream backend {
    zone backend 64k;
    # Default LB strategy is round-robin.
    server app1:8080 resolve max_fails=1 fail_timeout=10s;
    server app2:8080 resolve max_fails=1 fail_timeout=10s;
    server app3:8080 resolve max_fails=1 fail_timeout=10s;
}
upstream metrics_ui {
    zone metrics_ui 32k;
    server prometheus:9090 resolve;
}
upstream dashboard_ui {
    zone dashboard_ui 32k;
    server grafana:3000 resolve;
}
upstream tracing_ui {
    zone tracing_ui 32k;
    server jaeger:16686 resolve;
}
upstream trace_collector {
    zone trace_collector 32k;
    server jaeger:4317 resolve;
}

server {
    listen 127.0.0.1:4317;
    http2 on;
    client_max_body_size 4m;

    location / {
        grpc_pass grpc://trace_collector;
        grpc_connect_timeout 1s;
        grpc_read_timeout 2s;
        grpc_send_timeout 2s;
        access_log off;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 10m;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"error":"rate limit exceeded"}';
    }

    location = /docs {
        absolute_redirect off;
        return 302 /docs/;
    }

    location = /docs/openapi.yaml {
        alias /etc/nginx/openapi.yaml;
        default_type application/yaml;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
    }

    location /prometheus/ {
        proxy_pass http://metrics_ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        proxy_pass http://dashboard_ui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jaeger/ {
        proxy_pass http://tracing_ui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        otel_trace $trace_enabled;
        otel_trace_context propagate;
        otel_span_name "$request_method $uri";
        otel_span_attr request.id $request_id;
        add_header X-Trace-Id $otel_trace_id always;
        limit_req zone=root_requests burst=20 nodelay;
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx generates a per-request id and forwards it. The backend
        # reads it, logs it, and stamps it on the response. We deliberately
        # do NOT `add_header X-Request-Id` on this side — that would
        # duplicate the value the backend already returns.
        proxy_set_header X-Request-Id $request_id;

        # CRITICAL: never `proxy_set_header` or `add_header` X-Server-Id —
        # the backend owns that header so the client sees which replica
        # actually handled the request. nginx must forward it unchanged.

        # Fail-fast timeouts so a dead backend surfaces within ~2 seconds.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    15s;   # /slow can sleep up to 10s — leave headroom

        # Transparent retry on a different upstream when one errors. Three
        # tries ≈ at most one attempt per replica before giving up.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 0;
    }
}
