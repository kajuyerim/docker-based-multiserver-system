# Reverse proxy in front of three Go backend replicas. Round-robin
# load-balancing, fast failover on backend errors, end-to-end X-Request-Id
# tracing. Mounted into nginx:alpine at /etc/nginx/conf.d/default.conf,
# which is `include`d inside the default nginx.conf's http {} block.

upstream backend {
    # Default LB strategy is round-robin.
    server app1:8080 max_fails=1 fail_timeout=10s;
    server app2:8080 max_fails=1 fail_timeout=10s;
    server app3:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx generates a per-request id and forwards it. The backend
        # reads it, logs it, and stamps it on the response. We deliberately
        # do NOT `add_header X-Request-Id` on this side — that would
        # duplicate the value the backend already returns.
        proxy_set_header X-Request-Id $request_id;

        # CRITICAL: never `proxy_set_header` or `add_header` X-Server-Id —
        # the backend owns that header so the client sees which replica
        # actually handled the request. nginx must forward it unchanged.

        # Fail-fast timeouts so a dead backend surfaces within ~2 seconds.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    15s;   # /slow can sleep up to 10s — leave headroom

        # Transparent retry on a different upstream when one errors. Three
        # tries ≈ at most one attempt per replica before giving up.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 0;
    }
}
