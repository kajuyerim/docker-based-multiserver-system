# Compose stack: NGINX reverse proxy in front of three Go backend replicas
# backed by a persistent Redis primary and a read replica. The app containers
# run the same image (built once by app1, tagged multiserver-app:local) and
# differ only by SERVER_ID. NGINX is the only service publishing host ports;
# all other services live on Compose's internal network.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  redis-replica:
    image: redis:7-alpine
    command:
      - redis-server
      - --replicaof
      - redis
      - "6379"
      - --replica-read-only
      - "yes"
      - --replica-serve-stale-data
      - "no"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          info=$$(redis-cli --raw INFO replication) || exit 1
          printf '%s\n' "$$info" | tr -d '\r' | grep -qx 'role:slave' &&
          printf '%s\n' "$$info" | tr -d '\r' | grep -qx 'master_link_status:up' &&
          printf '%s\n' "$$info" | tr -d '\r' | grep -qx 'master_sync_in_progress:0'
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # stop_grace_period must exceed the app's 12s shutdown drain, which in turn
  # exceeds the longest legal request (/slow caps at 10s): 10s < 12s < 15s.
  app1:
    build: ./app
    image: multiserver-app:local
    environment:
      SERVER_ID: app1
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_READ_ADDR: redis-replica:6379
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  app2:
    image: multiserver-app:local
    environment:
      SERVER_ID: app2
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_READ_ADDR: redis-replica:6379
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  app3:
    image: multiserver-app:local
    environment:
      SERVER_ID: app3
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_READ_ADDR: redis-replica:6379
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    command: ["--config", "/etc/jaeger/config.yml"]
    volumes:
      - ./monitoring/jaeger/config.yml:/etc/jaeger/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:13133/status"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s' "$$AUTH_TOKEN" > /tmp/auth_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d --web.external-url=/prometheus/ --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost:8443/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/grafana/
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_AUTH_TOKEN:-local-renderer-only}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:v5.12.10
    profiles: [render]
    environment:
      AUTH_TOKEN: ${RENDERER_AUTH_TOKEN:-local-renderer-only}

  nginx:
    image: nginx:1.27.5-alpine-otel
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet --header=\"Authorization: Bearer $$AUTH_TOKEN\" http://127.0.0.1/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
