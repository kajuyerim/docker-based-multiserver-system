# Compose stack: Redis plus three identical backend replicas on Compose's
# internal network. The three replicas share a single image
# (multiserver-app:local): app1 builds it, app2 and app3 reference it. They
# differ only by the SERVER_ID env var. No host ports are published yet —
# Phase 7 will add nginx on host port 8080.

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  app1:
    build: ./app
    image: multiserver-app:local
    environment:
      SERVER_ID: app1
      PORT: "8080"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app2:
    image: multiserver-app:local
    environment:
      SERVER_ID: app2
      PORT: "8080"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app3:
    image: multiserver-app:local
    environment:
      SERVER_ID: app3
      PORT: "8080"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
