# Compose stack: NGINX reverse proxy in front of three Go backend replicas
# backed by a persistent Redis primary and a read replica. The app containers
# run the same image (built once by app1, tagged multiserver-app:local) and
# differ only by SERVER_ID. NGINX is the only service publishing host ports;
# all other services live on Compose's internal network.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  redis-replica:
    image: redis:7-alpine
    command:
      - redis-server
      - --replicaof
      - redis
      - "6379"
      - --replica-read-only
      - "yes"
      - --replica-serve-stale-data
      - "no"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          info=$$(redis-cli --raw INFO replication) || exit 1
          printf '%s\n' "$$info" | tr -d '\r' | grep -qx 'role:slave' &&
          printf '%s\n' "$$info" | tr -d '\r' | grep -qx 'master_link_status:up' &&
          printf '%s\n' "$$info" | tr -d '\r' | grep -qx 'master_sync_in_progress:0'
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # stop_grace_period must exceed the app's 12s shutdown drain, which in turn
  # exceeds the longest legal request (/slow caps at 10s): 10s < 12s < 15s.
  app1:
    build: ./app
    image: multiserver-app:local
    environment:
      SERVER_ID: app1
      PORT: "8080"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  app2:
    image: multiserver-app:local
    environment:
      SERVER_ID: app2
      PORT: "8080"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  app3:
    image: multiserver-app:local
    environment:
      SERVER_ID: app3
      PORT: "8080"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
