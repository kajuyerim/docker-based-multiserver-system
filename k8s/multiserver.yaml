apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiserver-nginx
spec:
  replicas: 1
  selector:
    matchLabels: {app: multiserver-nginx}
  template:
    metadata:
      labels: {app: multiserver-nginx}
      annotations:
        checksum/config: 71bd6693d96de9b73c26af2866b12b7190bc732c941ac7d2f022fc9fed712301
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports: [{name: http, containerPort: 80}]
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
          readinessProbe:
            exec:
              command: [sh, -ec, 'wget --spider --quiet --header="Authorization: Bearer ${AUTH_TOKEN:-}" http://127.0.0.1/health']
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            limits:
              cpu: 250m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: config
          configMap: {name: multiserver-nginx}

---
# Source: multiserver/templates/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiserver-redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: multiserver-redis}
  template:
    metadata:
      labels: {app: multiserver-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec]
          volumeMounts: [{name: data, mountPath: /data}]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec:
              command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: multiserver-redis}

---
# Source: multiserver/templates/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiserver-redis-replica
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: multiserver-redis-replica}
  template:
    metadata:
      labels: {app: multiserver-redis-replica}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --replicaof, multiserver-redis, "6379", --replica-read-only, "yes", --replica-serve-stale-data, "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  info=$(redis-cli --raw INFO replication)
                  echo "$info" | tr -d '\r' | grep -qx 'master_link_status:up'
                  echo "$info" | tr -d '\r' | grep -qx 'master_sync_in_progress:0'
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi

---
# Source: multiserver/templates/app.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multiserver-app
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: multiserver-app}
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

