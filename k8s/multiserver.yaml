# Source: multiserver/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiserver-app
spec:
  minReadySeconds: 6
  selector:
    matchLabels: {app: multiserver-app}
  template:
    metadata:
      labels: {app: multiserver-app}
      annotations:
        checksum/config: 71bd6693d96de9b73c26af2866b12b7190bc732c941ac7d2f022fc9fed712301
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: "multiserver-app:local"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: multiserver-app}
          env:
            - name: SERVER_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          readinessProbe:
            exec:
              command: [sh, -ec, 'wget --spider --quiet --header="Authorization: Bearer ${AUTH_TOKEN:-}" http://127.0.0.1:8080/health']
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [sh, -ec, 'wget --spider --quiet --header="Authorization: Bearer ${AUTH_TOKEN:-}" http://127.0.0.1:8080/health']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}

