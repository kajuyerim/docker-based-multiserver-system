apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-redis
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- range $role := list "redis" "redis-replica" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $role }}}
  template:
    metadata:
      labels: {app: {{ $.Release.Name }}-{{ $role }}}
    spec:
      containers:
        - name: redis
          image: {{ $.Values.redisImage }}
          {{- if eq $role "redis" }}
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec]
          volumeMounts: [{name: data, mountPath: /data}]
          {{- else }}
          args: [redis-server, --replicaof, {{ $.Release.Name }}-redis, "6379", --replica-read-only, "yes", --replica-serve-stale-data, "no"]
          {{- end }}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec:
              {{- if eq $role "redis" }}
              command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']
              {{- else }}
              command:
                - sh
                - -ec
                - |
                  info=$(redis-cli --raw INFO replication)
                  echo "$info" | tr -d '\r' | grep -qx 'master_link_status:up'
                  echo "$info" | tr -d '\r' | grep -qx 'master_sync_in_progress:0'
              {{- end }}
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml $.Values.redisResources | nindent 12 }}
      {{- if eq $role "redis" }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ $.Release.Name }}-redis}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  selector: {app: {{ $.Release.Name }}-{{ $role }}}
  ports: [{name: redis, port: 6379, targetPort: redis}]
{{- end }}
