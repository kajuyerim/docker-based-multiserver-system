replicaCount: 3
image:
  repository: multiserver-app
  tag: local
  pullPolicy: IfNotPresent
nginxImage: nginx:1.27.5-alpine
redisImage: redis:7-alpine
clusterDomain: cluster.local
dnsResolver: 10.96.0.10
# Optional existing Secret containing an AUTH_TOKEN key. Never put tokens here.
authSecret: ""
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 128Mi}
nginxResources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {cpu: 250m, memory: 64Mi}
redisResources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
persistence:
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: true
  className: traefik
  host: ""
  tlsSecret: ""
